name: Four complete-episode learning-rate curves
run-name: ${{ github.ref_name }}
on:
  push:
    tags:
      - 'four-episode-curves-*'
permissions:
  contents: write
concurrency:
  group: four-episode-curves-${{ github.ref_name }}
  cancel-in-progress: false
env:
  GH_TOKEN: ${{ github.token }}
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  PYTHONIOENCODING: utf-8
jobs:
  prepare:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9.25'
      - name: Load registered four-cell plan
        run: python experiments/four_episode_curves.py prepare --out runs/four --repo "$GITHUB_REPOSITORY" --tag "$GITHUB_REF_NAME"
      - name: Install exact CPU dependencies
        run: |
          python -m pip install torch==2.5.1+cpu --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
      - name: Complete-episode and full regression tests
        run: python experiments/hybrid_campaign.py verify-code --execute --out runs/cloud_checks
      - name: Retain verification
        if: always()
        run: |
          if [ -f runs/four/plan.json ]; then
            python experiments/four_episode_curves.py publish --out runs/four --repo "$GITHUB_REPOSITORY" --cell preparation --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" --execute
          fi
  train:
    needs: prepare
    runs-on: ubuntu-22.04
    timeout-minutes: 285
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        cell: [TMPPO_LR1_seed87021, TMPPO_LR2_seed87021, IPPO_LR1_seed87021, IPPO_LR2_seed87021]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9.25'
      - name: Load identical frozen plan
        run: python experiments/four_episode_curves.py prepare --out runs/four --repo "$GITHUB_REPOSITORY" --tag "$GITHUB_REF_NAME"
      - name: Install exact CPU dependencies
        run: |
          python -m pip install torch==2.5.1+cpu --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
      - name: Train128 complete episodes
        env:
          CELL: ${{ matrix.cell }}
        run: python -u experiments/four_episode_curves.py worker --out runs/four --cell "$CELL" --execute
      - name: Retain every outcome
        if: always()
        env:
          CELL: ${{ matrix.cell }}
        run: python experiments/four_episode_curves.py publish --out runs/four --repo "$GITHUB_REPOSITORY" --cell "$CELL" --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" --execute
