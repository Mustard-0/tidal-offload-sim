name: TT-MAPPO route-only development screen
on:
  push:
    branches: ['experiment/tt-mappo-route-residual-development-20261120']
permissions:
  contents: write
env:
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  CUDA_VISIBLE_DEVICES: '-1'
jobs:
  evaluate:
    if: github.repository == 'Mustard-0/tidal-offload-sim' && github.run_attempt == '1'
    runs-on: ubuntu-22.04
    timeout-minutes: 66
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        cell: ['control_seed871901','control_seed871909','route025_seed871901','route025_seed871909','route100_seed871901','route100_seed871909']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9.25'
      - run: |
          python -m pip install torch==2.5.1+cpu --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==2.0.2 scipy==1.13.1 cryptography==44.0.3
      - env:
          GH_TOKEN: ${{ github.token }}
          LR_SCREEN_TRANSPORT_KEY: ${{ secrets.LR_SCREEN_TRANSPORT_KEY }}
          CELL: ${{ matrix.cell }}
        run: python routing_dev_worker.py evaluate --cell "$CELL"
  selection:
    needs: evaluate
    if: always() && github.repository == 'Mustard-0/tidal-offload-sim' && github.run_attempt == '1'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9.25'
      - run: python -m pip install cryptography==44.0.3
      - env:
          GH_TOKEN: ${{ github.token }}
          LR_SCREEN_TRANSPORT_KEY: ${{ secrets.LR_SCREEN_TRANSPORT_KEY }}
        run: python routing_dev_worker.py select
