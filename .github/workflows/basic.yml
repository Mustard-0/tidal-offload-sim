name: N100 basic baselines and physically guarded TMAPO - six free CPU cells
on:
  push:
    tags: ['basic-n100-run-*']
permissions:
  contents: write
concurrency:
  group: basic-n100-${{ github.ref }}
  cancel-in-progress: false
env:
  CUDA_VISIBLE_DEVICES: '-1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  STUDY_CAMPAIGN: ${{ github.ref_name }}
  GH_TOKEN: ${{ github.token }}
  LR_SCREEN_TRANSPORT_KEY: ${{ secrets.LR_SCREEN_TRANSPORT_KEY }}
jobs:
  gate:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9.25'
      - name: Install pinned standard CPU runtime
        run: |
          python -m pip install torch==2.5.1+cpu --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==2.0.2 scipy==1.13.1 matplotlib==3.9.4 cryptography==44.0.3
      - name: Frozen contracts, real actor updates and exact checkpoint resume
        run: python -m study.cloud gate
  train:
    needs: gate
    name: ${{ matrix.cell }}
    runs-on: ubuntu-22.04
    timeout-minutes: 210
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        cell: [TMAPO_seed87021, TMAPO_seed87022, IPPO_seed87021, IPPO_seed87022, PPO_seed87021, PPO_seed87022]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9.25'
      - name: Install pinned standard CPU runtime
        run: |
          python -m pip install torch==2.5.1+cpu --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==2.0.2 scipy==1.13.1 matplotlib==3.9.4 cryptography==44.0.3
      - name: Single finite cell, private checkpoints and physical evaluation
        env:
          STUDY_CELL: ${{ matrix.cell }}
        run: python -m study.cloud worker --cell "$STUDY_CELL"
  collect:
    needs: [gate, train]
    if: ${{ always() && needs.gate.result == 'success' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9.25'
      - name: Install report runtime
        run: |
          python -m pip install torch==2.5.1+cpu --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==2.0.2 scipy==1.13.1 matplotlib==3.9.4 cryptography==44.0.3
      - name: Verify complete grid and encrypt observed comparison figures
        run: python -m study.cloud collect
