name: Baseline common fallback on matched one-seed windows
on:
  push:
    branches: ['experiment/baseline-capacity-single-seed-20261121']
permissions:
  contents: write
env:
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  CUDA_VISIBLE_DEVICES: '-1'
jobs:
  evaluate:
    if: github.repository == 'Mustard-0/tidal-offload-sim' && github.run_attempt == '1'
    runs-on: ubuntu-22.04
    timeout-minutes: 65
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - {method: IPPO, arm: control}
          - {method: IPPO, arm: guard}
          - {method: PPO, arm: control}
          - {method: PPO, arm: guard}
          - {method: SD-SAC-Adapted, arm: control}
          - {method: SD-SAC-Adapted, arm: guard}
          - {method: MARATD3-Adapted, arm: control}
          - {method: MARATD3-Adapted, arm: guard}
          - {method: Greedy-NoPrivacy, arm: control}
          - {method: Greedy-NoPrivacy, arm: guard}
          - {method: Greedy-GeoI, arm: control}
          - {method: Greedy-GeoI, arm: guard}
          - {method: Local-Only, arm: control}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9.25'
      - run: |
          python -m pip install torch==2.5.1+cpu --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==2.0.2 scipy==1.13.1 cryptography==44.0.3
      - env:
          GH_TOKEN: ${{ github.token }}
          LR_SCREEN_TRANSPORT_KEY: ${{ secrets.LR_SCREEN_TRANSPORT_KEY }}
          METHOD: ${{ matrix.method }}
          ARM: ${{ matrix.arm }}
        run: python baseline_capacity_worker.py "$METHOD" "$ARM"
