name: Local-Only matched queue disciplines
on:
  push:
    branches: ['experiment/local-only-queue-discipline-20261121']
permissions:
  contents: write
env:
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  CUDA_VISIBLE_DEVICES: '-1'
jobs:
  evaluate:
    if: github.repository == 'Mustard-0/tidal-offload-sim' && github.run_attempt == '1'
    runs-on: ubuntu-22.04
    timeout-minutes: 36
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        rule: [fifo, edf, deadline_spt]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9.25'
      - run: |
          python -m pip install torch==2.5.1+cpu --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==2.0.2 scipy==1.13.1 cryptography==44.0.3
      - env:
          GH_TOKEN: ${{ github.token }}
          LR_SCREEN_TRANSPORT_KEY: ${{ secrets.LR_SCREEN_TRANSPORT_KEY }}
          RULE: ${{ matrix.rule }}
        run: python local_sched_worker.py "$RULE"
