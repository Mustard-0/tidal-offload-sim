name: Seven independent baseline implementations
on:
  push:
    branches: ['experiment/stin-fresh-seven-baselines-20261122']
permissions:
  contents: write
env:
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  CUDA_VISIBLE_DEVICES: '-1'
jobs:
  benchmark:
    if: github.repository == 'Mustard-0/tidal-offload-sim' && github.run_attempt == '1'
    runs-on: ubuntu-22.04
    timeout-minutes: 70
    strategy:
      fail-fast: false
      max-parallel: 11
      matrix:
        include:
          - {method: IPPO, seed: '872011'}
          - {method: IPPO, seed: '872029'}
          - {method: PPO, seed: '872011'}
          - {method: PPO, seed: '872029'}
          - {method: SD-SAC-Adapted, seed: '872011'}
          - {method: SD-SAC-Adapted, seed: '872029'}
          - {method: MARATD3-Adapted, seed: '872011'}
          - {method: MARATD3-Adapted, seed: '872029'}
          - {method: Greedy-NoPrivacy, seed: '0'}
          - {method: Greedy-GeoI, seed: '0'}
          - {method: Local-Only, seed: '0'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9.25'
      - run: |
          python -m pip install torch==2.5.1+cpu --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==2.0.2 scipy==1.13.1 cryptography==44.0.3
      - env:
          GH_TOKEN: ${{ github.token }}
          LR_SCREEN_TRANSPORT_KEY: ${{ secrets.LR_SCREEN_TRANSPORT_KEY }}
          METHOD: ${{ matrix.method }}
          SEED: ${{ matrix.seed }}
        run: python fresh_baseline_worker.py "$METHOD" "$SEED"
