name: TT-MAPPO matched scale-up with compatible transport plan
on:
  push:
    branches: ['experiment/tt-mappo-matched-scale-up-20261119-gatefix']
permissions:
  contents: write
env:
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  CUDA_VISIBLE_DEVICES: '-1'
jobs:
  gate:
    if: github.repository == 'Mustard-0/tidal-offload-sim' && github.run_attempt == '1'
    runs-on: ubuntu-22.04
    timeout-minutes: 24
    outputs:
      train: ${{ steps.plan.outputs.train }}
      evaluate: ${{ steps.plan.outputs.evaluate }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9.25'
      - run: |
          python -m pip install torch==2.5.1+cpu --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==2.0.2 scipy==1.13.1 cryptography==44.0.3
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          LR_SCREEN_TRANSPORT_KEY: ${{ secrets.LR_SCREEN_TRANSPORT_KEY }}
        run: python scalability_worker_v2.py gate
  train:
    needs: gate
    runs-on: ubuntu-22.04
    timeout-minutes: 155
    strategy:
      max-parallel: 8
      fail-fast: false
      matrix: ${{ fromJSON(needs.gate.outputs.train) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9.25'
      - run: |
          python -m pip install torch==2.5.1+cpu --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==2.0.2 scipy==1.13.1 cryptography==44.0.3
      - env:
          GH_TOKEN: ${{ github.token }}
          LR_SCREEN_TRANSPORT_KEY: ${{ secrets.LR_SCREEN_TRANSPORT_KEY }}
          CELL: ${{ matrix.cell }}
        run: python scalability_worker_v2.py train --cell "$CELL"
  evaluate:
    needs: [gate, train]
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    strategy:
      max-parallel: 12
      fail-fast: false
      matrix: ${{ fromJSON(needs.gate.outputs.evaluate) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9.25'
      - run: |
          python -m pip install torch==2.5.1+cpu --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==2.0.2 scipy==1.13.1 cryptography==44.0.3
      - env:
          GH_TOKEN: ${{ github.token }}
          LR_SCREEN_TRANSPORT_KEY: ${{ secrets.LR_SCREEN_TRANSPORT_KEY }}
          CELL: ${{ matrix.cell }}
          TRACE: ${{ matrix.trace }}
        run: python scalability_worker_v2.py evaluate --cell "$CELL" --trace "$TRACE"
