name: Three algorithms 2000 complete episodes - free CPU
on:
  push:
    tags: ['lr-fast-run-*']
permissions:
  contents: write
concurrency:
  group: lr-fast-${{ github.ref }}
  cancel-in-progress: false
env:
  CUDA_VISIBLE_DEVICES: '-1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
jobs:
  plan:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9.25'
      - id: plan
        run: python -m experiments.episode_return.cloud_worker --plan
  train:
    needs: plan
    name: ${{ matrix.cell }}
    runs-on: ubuntu-22.04
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9.25'
      - name: Install frozen CPU runtime
        run: |
          python -m pip install torch==2.5.1+cpu --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==2.0.2 scipy==1.13.1 matplotlib==3.9.4 cryptography==44.0.3
      - name: Reviewed preflight and bounded segment
        env:
          GH_TOKEN: ${{ github.token }}
          LR_SCREEN_TRANSPORT_KEY: ${{ secrets.LR_SCREEN_TRANSPORT_KEY }}
          LR_SCREEN_CELL: ${{ matrix.cell }}
        run: python -m experiments.episode_return.cloud_worker --cell "$LR_SCREEN_CELL"
