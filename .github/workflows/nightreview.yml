name: Finite validation review - screens then conditional fair comparison
on:
  push:
    tags: ['nightreview-*']
permissions:
  contents: write
concurrency:
  group: nightreview-${{ github.ref }}
  cancel-in-progress: false
env:
  CUDA_VISIBLE_DEVICES: '-1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MODERATE_CAMPAIGN: ${{ github.ref_name }}
  GH_TOKEN: ${{ github.token }}
  LR_SCREEN_TRANSPORT_KEY: ${{ secrets.LR_SCREEN_TRANSPORT_KEY }}
jobs:
  gate:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9.25'
      - run: |
          python -m pip install torch==2.5.1+cpu --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==2.0.2 scipy==1.13.1 matplotlib==3.9.4 cryptography==44.0.3
      - run: python -m nightstudy.cloud gate
  screens:
    needs: gate
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        cell: [TMAPO_control_seed87021, TMAPO_control_seed87022, TMAPO_lr_seed87021, TMAPO_lr_seed87022, TMAPO_horizon_seed87021, TMAPO_horizon_seed87022, TMAPO_lr_horizon_seed87021, TMAPO_lr_horizon_seed87022, IPPO_control_seed87021, PPO_control_seed87021, SD-SAC-Adapted_control_seed87021, MARATD3-Adapted_control_seed87021]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9.25'
      - run: |
          python -m pip install torch==2.5.1+cpu --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==2.0.2 scipy==1.13.1 matplotlib==3.9.4 cryptography==44.0.3
      - env:
          NIGHT_CELL: ${{ matrix.cell }}
        run: python -m nightstudy.cloud screen --cell "$NIGHT_CELL"
  select:
    needs: [gate, screens]
    if: ${{ always() && needs.gate.result == 'success' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    outputs:
      allowed: ${{ steps.select.outputs.allowed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9.25'
      - run: python -m pip install cryptography==44.0.3
      - id: select
        run: python -m nightstudy.cloud select
  formal:
    needs: select
    if: ${{ needs.select.outputs.allowed == 'true' }}
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        cell: [TMAPO_seed87021, TMAPO_seed87022, IPPO_seed87021, IPPO_seed87022, PPO_seed87021, PPO_seed87022, SD-SAC-Adapted_seed87021, SD-SAC-Adapted_seed87022, MARATD3-Adapted_seed87021, MARATD3-Adapted_seed87022]
    uses: ./.github/workflows/nightreview_cell.yml
    with:
      cell: ${{ matrix.cell }}
    secrets:
      LR_SCREEN_TRANSPORT_KEY: ${{ secrets.LR_SCREEN_TRANSPORT_KEY }}
  rules:
    needs: select
    if: ${{ needs.select.outputs.allowed == 'true' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 210
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        cell: [Greedy, GeoI-Greedy]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9.25'
      - run: |
          python -m pip install torch==2.5.1+cpu --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==2.0.2 scipy==1.13.1 matplotlib==3.9.4 cryptography==44.0.3
      - env:
          NIGHT_CELL: ${{ matrix.cell }}
        run: python -m nightstudy.cloud evaluate --cell "$NIGHT_CELL"
  collect:
    needs: [select,formal,rules]
    if: ${{ always() && needs.select.outputs.allowed == 'true' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9.25'
      - run: |
          python -m pip install torch==2.5.1+cpu --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==2.0.2 scipy==1.13.1 matplotlib==3.9.4 cryptography==44.0.3
      - run: python -m nightstudy.cloud collect
