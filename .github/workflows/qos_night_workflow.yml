name: Original-trace QoS sweep and TMAPO-only sensitivity
on:
  push:
    branches: ['experiment/tmapo-qos-sensitivity-20261112']
permissions:
  contents: write
env:
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  CUDA_VISIBLE_DEVICES: '-1'
jobs:
  archive-gate:
    if: github.repository == 'Mustard-0/tidal-offload-sim' && github.run_attempt == '1'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9.25'
      - run: python -m pip install cryptography==44.0.3
      - env:
          GH_TOKEN: ${{ github.token }}
          LR_SCREEN_TRANSPORT_KEY: ${{ secrets.LR_SCREEN_TRANSPORT_KEY }}
        run: python qos_night_worker.py GeoI-Greedy
  qos-sweep:
    needs: archive-gate
    runs-on: ubuntu-22.04
    timeout-minutes: 55
    strategy:
      max-parallel: 12
      fail-fast: false
      matrix:
        cell: ["TMAPO_seed87021","TMAPO_seed87022","IPPO_seed87021","IPPO_seed87022","PPO_seed87021","PPO_seed87022","SD-SAC-Adapted_seed87021","SD-SAC-Adapted_seed87022","MARATD3-Adapted_seed87021","MARATD3-Adapted_seed87022","NoPrivacy_20","NoPrivacy_40","NoPrivacy_60","NoPrivacy_80","NoPrivacy_100","NoPrivacy_125"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9.25'
      - run: python -m pip install cryptography==44.0.3
      - if: startsWith(matrix.cell, 'NoPrivacy_')
        run: |
          python -m pip install torch==2.5.1+cpu --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==2.0.2 scipy==1.13.1
      - env:
          GH_TOKEN: ${{ github.token }}
          LR_SCREEN_TRANSPORT_KEY: ${{ secrets.LR_SCREEN_TRANSPORT_KEY }}
          CELL: ${{ matrix.cell }}
        run: python qos_night_worker.py "$CELL"
  tmapo-sensitivity:
    needs: qos-sweep
    runs-on: ubuntu-22.04
    timeout-minutes: 65
    strategy:
      max-parallel: 8
      fail-fast: false
      matrix:
        cell: ["epsilon05_seed87021","epsilon05_seed87022","epsilon2_seed87021","epsilon2_seed87022","wait0_seed87021","wait0_seed87022","wait10_seed87021","wait10_seed87022"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9.25'
      - run: |
          python -m pip install torch==2.5.1+cpu --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==2.0.2 scipy==1.13.1 cryptography==44.0.3
      - env:
          GH_TOKEN: ${{ github.token }}
          LR_SCREEN_TRANSPORT_KEY: ${{ secrets.LR_SCREEN_TRANSPORT_KEY }}
          CELL: ${{ matrix.cell }}
        run: python qos_night_worker.py "$CELL"
