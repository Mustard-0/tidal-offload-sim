name: Component-only packing equivalence and throughput gate
on:
  push:
    tags: ['highload-probe-*']
permissions:
  contents: write
env:
  CUDA_VISIBLE_DEVICES: '-1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
jobs:
  benchmark:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9.25'
      - name: Install pinned CPU runtime
        run: |
          python -m pip install torch==2.5.1+cpu --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==2.0.2 scipy==1.13.1 matplotlib==3.9.4 cryptography==44.0.3
      - name: Isolated component equivalence and throughput measurement
        env:
          GH_TOKEN: ${{ github.token }}
          LR_SCREEN_TRANSPORT_KEY: ${{ secrets.LR_SCREEN_TRANSPORT_KEY }}
        run: python -m ops.benchmark_packed
