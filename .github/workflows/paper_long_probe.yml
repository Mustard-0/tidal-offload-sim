name: Exploratory 2000-update long probe
run-name: ${{ github.ref_name }}

on:
  push:
    tags:
      - 'paper-long-probe-*'

permissions:
  contents: write

concurrency:
  group: long-probe-${{ github.ref_name }}
  cancel-in-progress: false

env:
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  PYTHONIOENCODING: utf-8

jobs:
  prepare:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9.25'
      - name: Load explicitly authorized frozen exploratory plan
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: python experiments/long_probe.py prepare --out runs/probe --repo "$REPO" --tag "$TAG"
      - name: Install exact CPU dependencies
        run: |
          python -m pip install torch==2.5.1+cpu --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
      - name: Unit tests and physical preflight on this exact commit
        run: python experiments/hybrid_campaign.py verify-code --execute --out runs/cloud_checks
      - name: Publish preparation diagnostics
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          if [ -f runs/probe/plan.json ]; then
            python experiments/long_probe.py publish --out runs/probe --repo "$REPO" --cell preparation --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" --execute
          fi

  train:
    needs: prepare
    runs-on: ubuntu-22.04
    timeout-minutes: 285
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        cell:
          - TMPPO_LR1_seed87021
          - TMPPO_LR2_seed87021
          - IPPO_LR1_seed87021
          - IPPO_LR2_seed87021
          - MARATD3-Adapted_LR1_seed87021
          - MARATD3-Adapted_LR2_seed87021
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9.25'
      - name: Load the same frozen plan
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: python experiments/long_probe.py prepare --out runs/probe --repo "$REPO" --tag "$TAG"
      - name: Install exact CPU dependencies
        run: |
          python -m pip install torch==2.5.1+cpu --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
      - name: Run one registered 2000-update exploratory cell
        env:
          CELL: ${{ matrix.cell }}
        run: python -u experiments/long_probe.py worker --out runs/probe --cell "$CELL" --execute
      - name: Retain checkpoint, raw traces and provisional curves on any exit
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CELL: ${{ matrix.cell }}
        run: |
          if [ -f runs/probe/cells/probe/"$CELL"/manifest.json ]; then
            python experiments/paper_convergence.py report --out runs/probe/cells/probe || true
          fi
          python experiments/long_probe.py publish --out runs/probe --repo "$REPO" --cell "$CELL" --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" --execute
